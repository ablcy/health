<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健康顾问 - Personal Health Advisor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>健康顾问</h1>
            <p>基于国际权威机构标准的个性化健康建议</p>
        </div>
    </header>

    <main class="container">
        <section class="input-section">
            <h2>输入您的健康信息</h2>
            <form id="healthForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="gender">性别</label>
                        <select id="gender" name="gender" required>
                            <option value="">请选择</option>
                            <option value="male">男性</option>
                            <option value="female">女性</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="age">年龄（岁）</label>
                        <input type="number" id="age" name="age" min="1" max="120" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="height">身高（厘米）</label>
                        <input type="number" id="height" name="height" min="100" max="250" required>
                    </div>
                    <div class="form-group">
                        <label for="weight">体重（公斤）</label>
                        <input type="number" id="weight" name="weight" min="30" max="300" step="0.1" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="goal">健康目标</label>
                    <select id="goal" name="goal" required>
                        <option value="">请选择您的目标</option>
                        <option value="maintain_health">保持健康</option>
                        <option value="maintain_shape">保持身材</option>
                        <option value="lose_weight">减肥</option>
                        <option value="gain_muscle">增肌</option>
                        <option value="improve_fitness">提升体能</option>
                    </select>
                </div>

                <button type="submit" class="submit-btn">获取个性化建议</button>
            </form>
        </section>

        <section class="result-section" id="resultSection" style="display: none;">
            <h2>您的健康报告</h2>
            
            <div class="bmi-card">
                <h3>身体质量指数（BMI）</h3>
                <div class="bmi-display">
                    <span id="bmiValue">--</span>
                    <span id="bmiCategory">--</span>
                </div>
                <div class="bmi-scale">
                    <div class="scale-item underweight">偏瘦</div>
                    <div class="scale-item normal">正常</div>
                    <div class="scale-item overweight">超重</div>
                    <div class="scale-item obese">肥胖</div>
                </div>
            </div>

            <div class="recommendations">
                <div class="rec-card sleep-card">
                    <h3>💤 睡眠建议</h3>
                    <div id="sleepRecommendations"></div>
                </div>

                <div class="rec-card exercise-card">
                    <h3>🏋️ 运动建议</h3>
                    <div id="exerciseRecommendations"></div>
                </div>

                <div class="rec-card diet-card">
                    <h3>🥗 饮食建议</h3>
                    <div id="dietRecommendations"></div>
                </div>

                <div class="rec-card meal-plan-card">
                    <h3>📅 一周食谱计划</h3>
                    <div id="mealPlanRecommendations"></div>
                </div>
            </div>

            <div class="sources-section">
                <h3>数据来源</h3>
                <ul id="sourcesList"></ul>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 健康顾问 | 基于世界卫生组织(WHO)、美国疾病控制与预防中心(CDC)等权威机构标准</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
